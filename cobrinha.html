<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Jogo da Cobrinha - Watson & Oráculo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1b 100%);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: manipulation;
    }
    .header {
      text-align: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(90deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    .score-board {
      display: flex;
      gap: 20px;
      margin-top: 6px;
      font-size: 15px;
      font-weight: 600;
      color: #a0aec0;
    }
    .score-item span {
      color: #00f2fe;
      font-weight: bold;
    }
    #game-container {
      position: relative;
      border: 3px solid #2d3748;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 242, 254, 0.2);
      background-color: #0d1117;
      overflow: hidden;
    }
    canvas {
      display: block;
      background-color: #090d16;
    }
    #game-over-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 17, 23, 0.88);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    #game-over-screen h2 {
      font-size: 28px;
      color: #ff4b5c;
      margin-bottom: 10px;
    }
    #game-over-screen p {
      color: #cbd5e0;
      margin-bottom: 20px;
      font-size: 16px;
    }
    .btn {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #0b0f19;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn:active {
      transform: scale(0.96);
    }
    /* Controles de Toque para Celular */
    .mobile-controls {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      gap: 10px;
      margin-top: 18px;
    }
    .touch-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      color: #fff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .touch-btn:active {
      background: rgba(0, 242, 254, 0.4);
      border-color: #00f2fe;
    }
    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 3; }
    
    .footer-seal {
      margin-top: 14px;
      font-size: 12px;
      color: #718096;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 class="title">🐍 Cobrinha Arcade</h1>
    <div class="score-board">
      <div class="score-item">Pontos: <span id="score">0</span></div>
      <div class="score-item">Recorde: <span id="high-score">0</span></div>
    </div>
  </div>

  <div id="game-container">
    <canvas id="canvas" width="340" height="340"></canvas>
    <div id="game-over-screen">
      <h2>Fim de Jogo!</h2>
      <p id="final-score-text">Você fez 0 pontos</p>
      <button class="btn" onclick="resetGame()">Jogar Novamente</button>
    </div>
  </div>

  <!-- Controles Virtuais para Celular -->
  <div class="mobile-controls">
    <button class="touch-btn btn-up" onclick="changeDir('UP')">▲</button>
    <button class="touch-btn btn-left" onclick="changeDir('LEFT')">◀</button>
    <button class="touch-btn btn-right" onclick="changeDir('RIGHT')">▶</button>
    <button class="touch-btn btn-down" onclick="changeDir('DOWN')">▼</button>
  </div>

  <div class="footer-seal">
    <span>🔮 Desenvolvido pelo Oráculo Antigravity & Watson</span>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScoreText = document.getElementById('final-score-text');

    const gridSize = 17;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_highscore') || 0;
    highScoreEl.innerText = highScore;

    let gameLoop = null;
    let isGameOver = false;
    let speed = 110;

    function init() {
      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
      ];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      scoreEl.innerText = score;
      isGameOver = false;
      gameOverScreen.style.display = 'none';
      spawnFood();
      clearInterval(gameLoop);
      gameLoop = setInterval(update, speed);
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
      // não nascer em cima da cobra
      for (let s of snake) {
        if (s.x === food.x && s.y === food.y) spawnFood();
      }
    }

    function update() {
      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Colisão com bordas
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        return gameOver();
      }

      // Colisão com corpo
      for (let s of snake) {
        if (s.x === head.x && s.y === head.y) {
          return gameOver();
        }
      }

      snake.unshift(head);

      // Comeu fruta
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.innerText = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.innerText = highScore;
          localStorage.setItem('snake_highscore', highScore);
        }
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Fundo
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grade sutil
      ctx.strokeStyle = '#141c2e';
      ctx.lineWidth = 0.5;
      for (let i = 0; i < canvas.width; i += gridSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Comida (Maçã neon)
      ctx.fillStyle = '#ff4b5c';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ff4b5c';
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2 - 2,
        0, Math.PI * 2
      );
      ctx.fill();
      ctx.shadowBlur = 0;

      // Cobra
      snake.forEach((part, index) => {
        if (index === 0) {
          ctx.fillStyle = '#00f2fe';
          ctx.shadowBlur = 8;
          ctx.shadowColor = '#00f2fe';
        } else {
          ctx.fillStyle = '#4facfe';
          ctx.shadowBlur = 0;
        }
        ctx.beginPath();
        ctx.roundRect(
          part.x * gridSize + 1,
          part.y * gridSize + 1,
          gridSize - 2,
          gridSize - 2,
          4
        );
        ctx.fill();
      });
      ctx.shadowBlur = 0;
    }

    function gameOver() {
      isGameOver = true;
      clearInterval(gameLoop);
      finalScoreText.innerText = `Você fez ${score} pontos!`;
      gameOverScreen.style.display = 'flex';
    }

    function resetGame() {
      init();
    }

    function changeDir(dir) {
      if (dir === 'UP' && dy !== 1) { nextDx = 0; nextDy = -1; }
      if (dir === 'DOWN' && dy !== -1) { nextDx = 0; nextDy = 1; }
      if (dir === 'LEFT' && dx !== 1) { nextDx = -1; nextDy = 0; }
      if (dir === 'RIGHT' && dx !== -1) { nextDx = 1; nextDy = 0; }
    }

    // Teclado
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') changeDir('UP');
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') changeDir('DOWN');
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') changeDir('LEFT');
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') changeDir('RIGHT');
    });

    // Touch Swipe no Canvas
    let touchStartX = 0;
    let touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].screenX - touchStartX;
      const diffY = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 30) changeDir('RIGHT');
        else if (diffX < -30) changeDir('LEFT');
      } else {
        if (diffY > 30) changeDir('DOWN');
        else if (diffY < -30) changeDir('UP');
      }
    }, { passive: true });

    init();
  </script>
</body>
</html>
